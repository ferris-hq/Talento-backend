# Production stack on the Hetzner API server (/opt/talento).
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

name: talento

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    command: ["arq", "worker.settings.WorkerSettings"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_MAX_JOBS: "1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  redis_data:
  caddy_data:
  caddy_config:
