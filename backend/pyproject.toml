[project]
name = "talento-backend"
version = "0.1.0"
description = "Talento API and video analysis workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "sentry-sdk[fastapi]>=2.19",
  "boto3>=1.43.95",
  "arq>=0.26",
  "mediapipe==0.10.21",
  "numpy>=1.26,<2",
  "scipy>=1.13",
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
# SQL is built only from constant column lists; values always go through $n parameters.
"app/routers/videos.py" = ["S608"]
"app/routers/trials.py" = ["S608"]
"app/routers/admin.py" = ["S608"]
"worker/media.py" = ["S404", "S603", "S607"]
