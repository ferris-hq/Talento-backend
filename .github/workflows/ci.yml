name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run database tests
        run: scripts/db-test.sh

  api:
    name: API lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --frozen
      - name: Pose model
        run: |
          mkdir -p models
          curl -sSfL -o models/pose_landmarker_full.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Prepare integration database
        run: |
          createdb talento_it
          psql -X -q -v ON_ERROR_STOP=1 -d talento_it -f ../supabase/tests/local/auth_stub.sql
          for f in ../supabase/migrations/*.sql; do psql -X -q -v ON_ERROR_STOP=1 -d talento_it -f "$f"; done
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talento_it

  image:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [database, api]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/talento-api:latest
            ghcr.io/${{ github.repository_owner }}/talento-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
